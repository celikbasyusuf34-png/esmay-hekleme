<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünyanın En İyi Takımı?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00674e, #28a745);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 550px;
            width: 90%;
            backdrop-filter: blur(8px);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button.option-btn {
            background-color: #ffffff;
            color: #333;
            border: none;
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 8px rgba(0,0,0,0.2);
        }

        button.option-btn:hover {
            background-color: #f8f9fa;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        button.option-btn:active {
            transform: translateY(1px);
        }

        #popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #popup-overlay img {
            max-width: 90%;
            max-height: 65vh;
            border-radius: 20px;
            border: 8px solid white;
            box-shadow: 0 0 40px rgba(255,255,255,0.8);
            margin-bottom: 20px;
            object-fit: contain;
        }

        #popup-text {
            font-size: 60px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0 20px;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }

        .wrong-text {
            color: #ff4d4d;
        }

        .correct-text {
            color: #33ff33;
        }
    </style>
</head>
<body>

    <div class="container" id="quiz-container">
        <h1>🏆 Dünyanın En İyi Takımı Hangisidir? 🏆</h1>
        <div class="options">
            <button class="option-btn" onclick="checkAnswer(false, 'Real Madrid')">Real Madrid</button>
            <button class="option-btn" onclick="checkAnswer(false, 'Barcelona')">Barcelona</button>
            <button class="option-btn" onclick="checkAnswer(false, 'Fenerbahçe')">Fenerbahçe</button>
            <button class="option-btn" onclick="checkAnswer(false, 'Galatasaray')">Galatasaray</button>
            <button class="option-btn" onclick="checkAnswer(true, 'Giresunspor')" style="background-color: #ffc107; color: #00674e; border: 3px solid #00674e;">Giresunspor</button>
        </div>
    </div>

    <div id="popup-overlay">
        <img id="popup-img" src="" alt="Cevap Görseli">
        <div id="popup-text"></div>
    </div>

    <script>
        const overlay = document.getElementById('popup-overlay');
        const popupText = document.getElementById('popup-text');
        const popupImg = document.getElementById('popup-img');

        // Web Audio API kullanarak güvenilir, tok ve kayan hata sesi üretme fonksiyonu
        function playWrongSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Ses ayarları
                osc.type = 'sawtooth'; // Tok, gıcık testere dişi dalgası
                osc.frequency.setValueAtTime(165, audioCtx.currentTime); // Başlangıç frekansı (Re3 - tok)
                osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.6); // 0.6 saniyede pesleştir (La1 - derin)

                gain.gain.setValueAtTime(0.35, audioCtx.currentTime); // Ses yüksekliği
                // Sesi anında kesmek yerine çok kısa bir "fade out" (yumuşak kapanış) yapalım
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime + 0.5);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6); // Ses toplam 0.6 saniye sürer
            } catch(e) {
                console.log("Ses üretilemedi: ", e);
            }
        }

        function checkAnswer(isCorrect, teamName) {
            // Önceki durumu sıfırla
            popupText.className = '';
            popupImg.style.borderColor = 'white';

            if (!isCorrect) {
                // Yanlış cevap durumu: Ses (Kodla üretilen) + Yazı + Fotoğraf
                playWrongSound(); // Ses artık kesin çalacak
                popupText.innerText = "DAAAAAAATTTT";
                popupText.classList.add('wrong-text');
                popupImg.src = "https://i.hizliresim.com/gko9kjq1.jpg"; // Gözlüklü abi
                popupImg.style.borderColor = "#ff4d4d"; // Kırmızı çerçeve
                
                overlay.classList.add('show');

                // 1.5 saniye sonra popup'ı kapat
                setTimeout(() => {
                    overlay.classList.remove('show');
                }, 1500);

            } else {
                // Doğru cevap durumu (Giresunspor): SADECE Yazı + Fotoğraf (Ses yok)
                popupText.innerText = "AFERİNNN";
                popupText.classList.add('correct-text');
                popupImg.src = "https://i.hizliresim.com/r3cssowl.jpg"; // Coşkulu abi
                popupImg.style.borderColor = "#33ff33"; // Yeşil çerçeve

                overlay.classList.add('show');
                // Doğru cevapta fotoğraf ekranda kalır, ses çalmaz.
            }
        }
    </script>
</body>
</html>
