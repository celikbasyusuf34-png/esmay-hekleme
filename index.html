<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esma & Yusuf</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            touch-action: manipulation;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            padding: 0 20px;
            transition: all 0.3s ease;
        }

        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
            width: 100%;
            max-width: 350px;
            justify-content: center;
            align-items: center;
            height: 120px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s ease, font-size 0.2s ease, padding 0.2s ease;
            white-space: nowrap;
        }

        #evetBtn {
            background-color: #28a745;
            color: white;
            z-index: 10;
        }

        #hayirBtn {
            background-color: #dc3545;
            color: white;
            position: relative;
        }

        /* Sonuç Ekranı Tasarımı */
        .sonuc-kapsayici {
            display: none;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 0 20px;
        }

        .sonuc-mesaj {
            color: #d63384;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            line-height: 1.4;
        }

        .kalpli-yazi {
            position: relative;
            display: inline-block;
            font-size: 2rem;
            color: #ff3366;
            font-weight: bold;
            margin-top: 10px;
            animation: kalpAtis 1.2s infinite;
        }

        /* Etraftaki uçuşan kalpler */
        .kalp {
            position: absolute;
            color: #ff3366;
            font-size: 1.5rem;
            animation: yukariUc 3s infinite linear;
            opacity: 0;
        }

        @keyframes kalpAtis {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes yukariUc {
            0% {
                transform: translateY(0px) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1 id="soruMetni">Esma Yusuf'a Instagram hesabını verecek mi?</h1>

    <div class="buttons" id="butonAlani">
        <button id="evetBtn" onclick="evetTiklandi()">Evet</button>
        <button id="hayirBtn" ontouchstart="kacir(event)" onclick="kacir(event)">Hayır</button>
    </div>

    <div class="sonuc-kapsayici" id="sonucAlani">
        <div class="sonuc-mesaj">Biz de öyle düşünmüştük 😄<br>Şimdi Yusuf'a şifreni gönder! 🔑</div>
        <div class="kalpli-yazi">
            Seni Seviyorum ❤️
            <!-- Etraftaki yüzen kalpler -->
            <span class="kalp" style="left: -30px; animation-delay: 0s;">💖</span>
            <span class="kalp" style="right: -30px; animation-delay: 1s;">💗</span>
            <span class="kalp" style="left: 20px; top: -30px; animation-delay: 0.5s;">💓</span>
            <span class="kalp" style="right: 10px; top: -30px; animation-delay: 1.5s;">💘</span>
        </div>
    </div>

    <script>
        const hayirBtn = document.getElementById('hayirBtn');
        const evetBtn = document.getElementById('evetBtn');
        const soruMetni = document.getElementById('soruMetni');
        const butonAlani = document.getElementById('butonAlani');
        const sonucAlani = document.getElementById('sonucAlani');

        let tiklamaSayisi = 0;

        function kacir(e) {
            // Mobilde tıklama anında sayfanın kaymasını/zoom olmasını engelle
            if (e) e.preventDefault();

            tiklamaSayisi++;

            // Her "Hayır" denildiğinde Evet butonunu büyüt
            let yeniBoyut = 1 + (tiklamaSayisi * 0.25);
            let yeniPaddingV = 12 + (tiklamaSayisi * 4);
            let yeniPaddingH = 25 + (tiklamaSayisi * 8);
            
            evetBtn.style.fontSize = yeniBoyut + 'rem';
            evetBtn.style.padding = `${yeniPaddingV}px ${yeniPaddingH}px`;

            // Telefonda ekran sınırları içinde rastgele kaçma koordinatları
            const maxX = window.innerWidth - hayirBtn.offsetWidth - 40;
            const maxY = window.innerHeight - hayirBtn.offsetHeight - 40;

            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            hayirBtn.style.position = 'fixed';
            hayirBtn.style.left = randomX + 'px';
            hayirBtn.style.top = randomY + 'px';
        }

        function evetTiklandi() {
            soruMetni.style.display = 'none';
            butonAlani.style.display = 'none';
            sonucAlani.style.display = 'flex';
        }
    </script>

</body>
</html>
